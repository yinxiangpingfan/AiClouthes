            padding: 0 20px;
        }

        .logo img {

            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #4a90e2;
        }

        .logo h1 {
            color: #4a90e2;
            font-size: 20px;
            font-weight: bold;

        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: #555;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {

            color: white;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 16px;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
        }

        .page-header {
            text-align: center;
            color: black;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* 步骤卡片 */
        .steps-container {
            display: grid;
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

            }

                margin-left: 250px;

            }
            
            .page-title {
                font-size: 32px;
            }
            
            .steps-container {

                font-size: 12px;
            }
            
            .step-card {

        }

            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .step-number {

            height: 40px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .step-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .city-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        }

        .action-button {

            border: none;

            font-size: 14px;

            color: #666;

            from { opacity: 0; }

            from {

                transform: translateY(-20px);

            to {
                opacity: 1;
                transform: translateY(0);
            }

        @keyframes slideInRight {
            from {

                transform: translateX(100%);

        // 初始化页面
        function initPage() {
            loadProvinces();
            checkLogin();
        }

        // 检查登录状态
        function checkLogin() {
            const token = getCookie('token');
            if (!token) {
                window.location.href = '/login';
            }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // 加载省份数据
        function loadProvinces() {
            const provinceSelect = document.getElementById('provinceSelect');
            provinceSelect.innerHTML = '<option value="">请选择省份</option>';
            cityData.forEach(item => {
                const option = document.createElement('option');
                option.value = item.provice;
                option.textContent = item.provice;
                provinceSelect.appendChild(option);
            });
            
            // 恢复之前保存的选择
            const savedProvince = localStorage.getItem('selectedProvince');
            const savedCity = localStorage.getItem('selectedCity');
            
            if (savedProvince) {
                provinceSelect.value = savedProvince;
                // 触发省份变化事件来加载城市
                const event = new Event('change');
                provinceSelect.dispatchEvent(event);
                
                // 等待城市加载完成后设置城市选择
                setTimeout(() => {
                    if (savedCity) {
                        const citySelect = document.getElementById('citySelect');
                        citySelect.value = savedCity;
                    }
                }, 100);
            }
        }

        // 省份选择变化
        document.getElementById('provinceSelect').addEventListener('change', function() {
            const selectedProvince = this.value;
            const citySelect = document.getElementById('citySelect');
            
            // 保存省份选择到本地存储
            if (selectedProvince) {
                localStorage.setItem('selectedProvince', selectedProvince);
            } else {
                localStorage.removeItem('selectedProvince');
                localStorage.removeItem('selectedCity');
            }
            
            // 清空城市选择
            citySelect.innerHTML = '<option value="">请选择城市</option>';
            
            if (selectedProvince) {
                const provinceData = cityData.find(item => item.provice === selectedProvince);
                if (provinceData) {
                    provinceData.city.forEach(city => {
                        const option = document.createElement('option');
                        option.value = city.adcode;
                        option.textContent = city.name;
                        citySelect.appendChild(option);
                    });
                    citySelect.disabled = false;
                }
            } else {
                citySelect.disabled = true;
            }
        });
        
        // 城市选择变化
        document.getElementById('citySelect').addEventListener('change', function() {
            const selectedCity = this.value;
            
            // 保存城市选择到本地存储
            if (selectedCity) {
                localStorage.setItem('selectedCity', selectedCity);
            } else {
                localStorage.removeItem('selectedCity');
            }
        });

        // 获取天气
        async function getWeather() {
            const cityCode = document.getElementById('citySelect').value;
            if (!cityCode) {
                showError('weatherError', '请选择城市');
                return;
            }

            const loading = document.getElementById('weatherLoading');
            const errorDiv = document.getElementById('weatherError');
            const infoDiv = document.getElementById('weatherInfo');
            const btn = document.getElementById('getWeatherBtn');

            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('code', cityCode);

                const response = await fetch('/user/weather/get', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.code === 1000) {
                    currentWeatherData = result.data;
                    displayWeather(result.data);
                    document.getElementById('getRecommendationBtn').disabled = false;
                } else {
                    showError('weatherError', result.msg || '获取天气失败');
                }
            } catch (error) {
                showError('weatherError', '网络错误，请稍后重试');
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        // 显示天气信息
        function displayWeather(data) {
            const detailsDiv = document.getElementById('weatherDetails');
            const forecast = data.forecasts[0];
            const todayWeather = forecast.casts[0];

            detailsDiv.innerHTML = `
                <div class="weather-item">
                    <span>城市：</span>
                    <span>${forecast.city}</span>
                </div>
                <div class="weather-item">
                    <span>日期：</span>
                    <span>${todayWeather.date}</span>
                </div>
                <div class="weather-item">
                    <span>白天天气：</span>
                    <span>${todayWeather.dayweather}</span>
                </div>
                <div class="weather-item">
                    <span>夜间天气：</span>
                    <span>${todayWeather.nightweather}</span>
                </div>
                <div class="weather-item">
                    <span>温度范围：</span>
                    <span>${todayWeather.nighttemp}°C - ${todayWeather.daytemp}°C</span>
                </div>
                <div class="weather-item">
                    <span>风向风力：</span>
                    <span>${todayWeather.daywind}风 ${todayWeather.daypower}级</span>
                </div>
            `;

            document.getElementById('weatherInfo').style.display = 'block';
        }

        // 获取穿搭推荐
        async function getRecommendation() {
            if (!currentWeatherData) {
                showError('recommendationError', '请先获取天气信息');
                return;
            }

            const loading = document.getElementById('recommendationLoading');
            const errorDiv = document.getElementById('recommendationError');
            const infoDiv = document.getElementById('recommendationInfo');
            const btn = document.getElementById('getRecommendationBtn');

            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            btn.disabled = true;

            try {
                const forecast = currentWeatherData.forecasts[0];
                const todayWeather = forecast.casts[0];
                
                const weatherDesc = `白天${todayWeather.dayweather}，${todayWeather.daywind}风${todayWeather.daypower}级，最高气温${todayWeather.daytemp}℃；夜间${todayWeather.nightweather}，${todayWeather.nightwind}风${todayWeather.nightpower}级，最低气温${todayWeather.nighttemp}℃。`;

                const formData = new FormData();
                formData.append('weather', weatherDesc);

                const response = await fetch('/user/weather/make', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.code === 1000) {
                    currentRecommendation = result.data.ClothingMatch;
                    displayRecommendation(result.data.ClothingMatch);
                    document.getElementById('generateImageBtn').disabled = false;
                } else {
                    showError('recommendationError', result.msg || '获取推荐失败');
                }
            } catch (error) {
                showError('recommendationError', '网络错误，请稍后重试');
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        // 显示推荐信息
        function displayRecommendation(recommendation) {
            const detailsDiv = document.getElementById('recommendationDetails');
            
            detailsDiv.innerHTML = `
                <div class="clothing-item">
                    <strong>上衣推荐：</strong>${recommendation.UpperGarment}
                </div>
                <div class="clothing-item">
                    <strong>下装推荐：</strong>${recommendation.Bottoms}
                </div>
            `;

            document.getElementById('recommendationInfo').style.display = 'block';
        }

        // 生成试穿图片
        async function generateImage() {
            if (!currentRecommendation) {
                showError('imageError', '请先获取穿搭推荐');
                return;
            }

            const loading = document.getElementById('imageLoading');
            const errorDiv = document.getElementById('imageError');
            const resultDiv = document.getElementById('resultImage');
            const btn = document.getElementById('generateImageBtn');

            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            btn.disabled = true;

            try {
                const information = `上衣${currentRecommendation.UpperGarment}，裤子${currentRecommendation.Bottoms}`;
                
                // 使用GET方法，将信息作为查询参数
                const encodedInfo = encodeURIComponent(information);
                const response = await fetch(`/user/weather/makepic?information=${encodedInfo}`, {
                    method: 'GET'
                });

                const result = await response.json();

                if (result.code === 1000) {
                    displayGeneratedImage(result.url);
                } else {
                    showError('imageError', result.msg || '生成图片失败');
                }
            } catch (error) {
                showError('imageError', '网络错误，请稍后重试');
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        // 显示生成的图片
        function displayGeneratedImage(imageUrl) {
            const img = document.getElementById('generatedImage');
            img.src = imageUrl;
            img.onload = function() {
                document.getElementById('resultImage').style.display = 'block';
            };
        }

        // 显示错误信息
        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 修改密码
        function changePassword() {
            const token = getCookie('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            showPasswordModal();
        }
        
        // 显示修改密码弹窗
        function showPasswordModal() {
            const modal = document.createElement('div');
            modal.className = 'password-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>修改密码</h3>
                        <span class="close-btn" onclick="closePasswordModal()">&times;</span>
                    </div>
                    <div class="modal-body">
                        <div class="input-group">
                            <label>新密码:</label>
                            <input type="password" id="newPassword" placeholder="请输入新密码">
                        </div>
                        <div class="input-group">
                            <label>确认密码:</label>
                            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closePasswordModal()">取消</button>
                        <button class="btn-confirm" onclick="submitPasswordChange()">确认修改</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 聚焦到第一个输入框
            setTimeout(() => {
                document.getElementById('newPassword').focus();
            }, 100);
        }
        
        // 关闭修改密码弹窗
        function closePasswordModal() {
            const modal = document.querySelector('.password-modal');
            if (modal) {
                modal.remove();
            }
        }
        
        // 提交密码修改
        function submitPasswordChange() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword) {
                showMessage('请输入新密码', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('密码长度至少6位', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            // 发送修改密码请求
            const formData = new FormData();
            formData.append('newpassword', newPassword);
            
            fetch('/user/chanpass', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    showMessage('密码修改成功！', 'success');
                    closePasswordModal();
                } else {
                    showMessage(data.msg || '密码修改失败，请重试', 'error');
                }
            })
            .catch(error => {
                showMessage('网络错误，请稍后重试', 'error');
            });
        }
        
        // 显示消息提示
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-toast ${type}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
        
        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 发送退出登录请求
                fetch('/user/logout', {
                    method: 'GET'
                })
                .then(() => {
                    // 清除cookie
                    document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    // 跳转到登录页面
                    window.location.href = '/login';
                })
                .catch(() => {
                    // 即使请求失败也清除本地cookie并跳转
                    document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    window.location.href = '/login';
                });
            }
        }

        // 导航链接点击事件
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href !== '/frontend/index.html' && href !== '/frontend/login.html') {
                    const token = getCookie('token');
                    if (!token) {
                        e.preventDefault();
                        window.location.href = '/login';
                    }
                }
            });
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
