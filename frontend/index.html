<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能穿搭助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #F1DFD3;
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background: #E4C2C1;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #4a90e2;
        }

        .logo h1 {
            color: #4a90e2;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: #555;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 16px;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
        }

        .hero-section {
            text-align: center;
            color: black;
            margin-bottom: 60px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.2);
            color: black;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .cta-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* 功能卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        /* 响应式设计 - 平板端 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 250px;
            }
            
            .main-content {
                margin-left: 250px;
                padding: 30px 20px;
            }
            
            .hero-title {
                font-size: 36px;
            }
            
            .features {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 25px;
                margin-top: 40px;
            }
        }
        
        /* 响应式设计 - 手机端 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 20px 0;
            }
            
            .main-content {
                margin-left: 0;
                padding: 20px 15px;
            }
            
            .hero-title {
                font-size: 28px;
            }
            
            .hero-subtitle {
                font-size: 16px;
            }
            
            .features {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 30px;
            }
            
            .feature-card {
                padding: 25px;
            }
            
            .feature-icon {
                font-size: 36px;
            }
            
            .feature-title {
                font-size: 18px;
            }
            
            .nav-menu {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            
            .nav-item {
                flex: 1;
                min-width: 120px;
                text-align: center;
                margin-bottom: 10px;
            }
        }
        
        /* 小屏手机优化 */
        @media (max-width: 480px) {
            .main-content {
                padding: 15px 10px;
            }
            
            .hero-title {
                font-size: 24px;
            }
            
            .hero-subtitle {
                font-size: 14px;
            }
            
            .feature-card {
                padding: 20px;
            }
            
            .feature-icon {
                font-size: 32px;
            }
            
            .feature-title {
                font-size: 16px;
            }
            
            .nav-item {
                min-width: 100px;
                font-size: 14px;
            }
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .feature-icon {
            font-size: 48px;
            color: #4a90e2;
            margin-bottom: 20px;
        }

        .feature-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .feature-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .feature-button {
            display: inline-block;
            padding: 10px 25px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .feature-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
        }

        /* 用户操作区域 */
        .user-actions {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .action-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 10px;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 12px;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border-color: #4a90e2;
            transform: translateX(5px);
        }

        .action-btn .nav-icon {
            margin-right: 12px;
            font-size: 16px;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #e74c3c;
        }

        /* 修改密码弹窗样式 */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            padding: 20px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }

        .close-btn {
            font-size: 24px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #666;
        }

        .modal-body {
            padding: 20px 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .modal-footer {
            padding: 0 24px 20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel, .btn-confirm {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e8e8e8;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
        }

        .btn-confirm:hover {
            background: linear-gradient(135deg, #357abd, #2968a3);
        }

        /* 消息提示样式 */
        .message-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            z-index: 1001;
            animation: slideInRight 0.3s ease;
        }

        .message-toast.success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }

        .message-toast.error {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .hero-title {
                font-size: 32px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="logo">
                <img src="/frontend/2531750494569_.pic_hd.jpg" alt="AI穿搭助手">
                <h1>AI穿搭助手</h1>
                <p>智能穿搭，时尚生活</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/frontend/index.html" class="nav-link active">
                        <span class="nav-icon">🏠</span>
                        首页
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/frontend/weather.html" class="nav-link">
                        <span class="nav-icon">🌤️</span>
                        天气穿搭
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/frontend/wardrobe.html" class="nav-link">
                        <span class="nav-icon">👗</span>
                        衣柜搭配
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/frontend/try-on.html" class="nav-link">
                        <span class="nav-icon">👔</span>
                        虚拟试衣
                    </a>
                </li>
            </ul>
            
            <!-- 用户操作区域 -->
            <div class="user-actions">
                <button class="action-btn" onclick="changePassword()">
                    <span class="nav-icon">🔑</span>
                    修改密码
                </button>
                <button class="action-btn logout-btn" onclick="logout()">
                    <span class="nav-icon">🚪</span>
                    退出登录
                </button>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <main class="main-content">
            <section class="hero-section">
                <h1 class="hero-title">AI智能穿搭助手</h1>
                <p class="hero-subtitle">让AI为你打造专属时尚风格，智能推荐，精准搭配</p>
                <a href="#" class="cta-button" onclick="checkLoginAndRedirect()">立即体验</a>
            </section>

            <section class="features">
                <div class="feature-card">
                    <div class="feature-icon">🌤️</div>
                    <h3 class="feature-title">天气智能穿搭</h3>
                    <p class="feature-desc">根据实时天气数据，AI为你推荐最适合的穿搭方案，让你在任何天气都能保持完美造型。</p>
                    <a href="/frontend/weather.html" class="feature-button">开始使用</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">👗</div>
                    <h3 class="feature-title">衣柜智能搭配</h3>
                    <p class="feature-desc">上传你的衣柜照片，AI识别衣物并根据场合需求为你推荐最佳搭配组合。</p>
                    <a href="/frontend/wardrobe.html" class="feature-button">开始使用</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">👔</div>
                    <h3 class="feature-title">虚拟试衣体验</h3>
                    <p class="feature-desc">无需实际试穿，通过AI技术预览穿搭效果，支持单品和套装试穿。</p>
                    <a href="/frontend/try-on.html" class="feature-button">开始使用</a>
                </div>
            </section>
        </main>
    </div>

    <script>
        function checkLoginAndRedirect() {
            // 检查是否已登录
            const token = getCookie('token');
            if (token) {
                // 已登录，跳转到天气穿搭页面
                window.location.href = '/weather';
            } else {
                // 未登录，跳转到登录页面
                window.location.href = '/login';
            }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // 修改密码
        function changePassword() {
            const token = getCookie('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            showPasswordModal();
        }
        
        // 显示修改密码弹窗
        function showPasswordModal() {
            const modal = document.createElement('div');
            modal.className = 'password-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>修改密码</h3>
                        <span class="close-btn" onclick="closePasswordModal()">&times;</span>
                    </div>
                    <div class="modal-body">
                        <div class="input-group">
                            <label>新密码:</label>
                            <input type="password" id="newPassword" placeholder="请输入新密码">
                        </div>
                        <div class="input-group">
                            <label>确认密码:</label>
                            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closePasswordModal()">取消</button>
                        <button class="btn-confirm" onclick="submitPasswordChange()">确认修改</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 聚焦到第一个输入框
            setTimeout(() => {
                document.getElementById('newPassword').focus();
            }, 100);
        }
        
        // 关闭修改密码弹窗
        function closePasswordModal() {
            const modal = document.querySelector('.password-modal');
            if (modal) {
                modal.remove();
            }
        }
        
        // 提交密码修改
        function submitPasswordChange() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword) {
                showMessage('请输入新密码', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('密码长度至少6位', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            // 发送修改密码请求
            const formData = new FormData();
            formData.append('newpassword', newPassword);
            
            fetch('/user/chanpass', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    showMessage('密码修改成功！', 'success');
                    closePasswordModal();
                } else {
                    showMessage(data.msg || '密码修改失败，请重试', 'error');
                }
            })
            .catch(error => {
                showMessage('网络错误，请稍后重试', 'error');
            });
        }
        
        // 显示消息提示
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-toast ${type}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
        
        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 发送退出登录请求
                fetch('/user/logout', {
                    method: 'GET'
                })
                .then(() => {
                    // 清除cookie
                    document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    // 跳转到登录页面
                    window.location.href = '/login';
                })
                .catch(() => {
                    // 即使请求失败也清除本地cookie并跳转
                    document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    window.location.href = '/login';
                });
            }
        }

        // 导航链接点击事件
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href !== '/frontend/index.html' && href !== '/frontend/login.html') {
                    const token = getCookie('token');
                    if (!token) {
                        e.preventDefault();
                        window.location.href = '/login';
                    }
                }
            });
        });
    </script>
</body>
</html>
